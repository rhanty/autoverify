<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0b0d12;--card:#151922;--card2:#1c212c;--line:#262c39;--tx:#eef1f6;--mut:#8b93a5;--acc:#ff6a1a;--ok:#22c55e;--err:#ef4444}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0b0d12;color:#eef1f6;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#root{min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(120% 50% at 50% 0,#1a1f2c 0,#0b0d12 60%)}
.top{padding:18px 20px 8px;display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#ff6a1a,#c2410c);display:grid;place-items:center;flex:none}
.grow{flex:1;min-width:0}
.brand{font-weight:800;font-size:18px}.brand span{color:var(--acc)}
.sub{font-size:12px;color:var(--mut)}
.lang{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 6px 0 8px;color:var(--mut)}
.lang select{background:none;border:0;color:var(--tx);font:600 13px sans-serif;padding:8px 2px;outline:0}
.lang option{background:#151922}
.seg{margin:10px 20px 4px;display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{border:0;background:none;color:var(--mut);padding:10px;border-radius:10px;font:600 14px sans-serif;display:flex;gap:6px;align-items:center;justify-content:center;cursor:pointer}
.seg button.on{background:var(--card2);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line)}
.seg button.on svg{color:var(--acc)}
main{padding:12px 20px 30px;flex:1}
h2{margin:8px 0 4px;font-size:22px}
p.lead{margin:0 0 16px;color:var(--mut);font-size:14px;line-height:1.45}
label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.6px}
.field{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px}
.field:focus-within{border-color:var(--acc)}
.field svg{color:var(--mut);flex:none}
input,textarea{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font:500 16px sans-serif;padding:14px 0}
textarea{resize:none;min-height:96px;line-height:1.4}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:1.5px}
.cnt{font-size:11px;color:var(--mut);white-space:nowrap}
.btn{width:100%;border:0;border-radius:14px;padding:16px;font:700 16px sans-serif;color:#fff;display:flex;gap:8px;align-items:center;justify-content:center;cursor:pointer;background:linear-gradient(135deg,#ff6a1a,#ea580c);box-shadow:0 8px 24px -8px rgba(255,106,26,.6);margin-top:18px}
.btn:disabled{opacity:.5;box-shadow:none}
.btn.ghost{background:var(--card2);box-shadow:none;border:1px dashed #3a4252;margin-top:10px;padding:13px;font-size:14px}
.err{color:var(--err);font-size:12px;margin-top:6px}
.toast{margin-top:16px;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.45);color:#86efac;border-radius:14px;padding:14px;display:flex;gap:10px;align-items:flex-start;font-size:14px;animation:pop .3s}
.toast b{color:var(--ok);display:block}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.scanfx{position:relative;overflow:hidden}
.scanfx:after{content:"";position:absolute;left:0;right:0;height:2px;background:var(--acc);box-shadow:0 0 14px var(--acc);animation:scan 1s linear infinite}
@keyframes scan{from{top:0}to{top:100%}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:6px 10px;font:600 11px ui-monospace,Menlo,monospace;cursor:pointer}
.msg{margin-top:16px;border-radius:16px;padding:18px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.4);display:flex;gap:10px;align-items:center;color:#fca5a5;font-size:14px}
.card{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.vin{font:700 15px ui-monospace,Menlo,monospace;letter-spacing:1.5px;word-break:break-all}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{background:var(--card2);border-radius:12px;padding:12px}
.stat small{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.5px;display:flex;gap:5px;align-items:center}
.stat div{font-size:19px;font-weight:800;margin-top:4px}
.tl{position:relative;margin-top:14px;padding-left:22px}
.tl:before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.it{position:relative;background:var(--card2);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.it:before{content:"";position:absolute;left:-21px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px #0b0d12}
.it.lk:before{background:var(--acc)}
.it .d{font-size:12px;color:var(--mut)}
.it .k{font-weight:700;margin:4px 0}
.it .t{font-size:14px;line-height:1.4}
.blur{filter:blur(6px);user-select:none;pointer-events:none}
.fine{text-align:center;color:var(--mut);font-size:12px;margin-top:10px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:430px;background:var(--card);border-radius:24px 24px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.pbtn{width:100%;border:0;border-radius:12px;padding:15px;margin-top:10px;font:600 16px sans-serif;display:flex;gap:8px;justify-content:center;align-items:center;cursor:pointer}
.ap{background:#fff;color:#000}.gp{background:#000;color:#fff;border:1px solid #444}
.spin{width:44px;height:44px;border:4px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:rot .8s linear infinite;margin:20px auto}
@keyframes rot{to{transform:rotate(360deg)}}
.back{background:none;border:0;color:var(--mut);font:600 13px sans-serif;cursor:pointer;margin-top:14px;width:100%}
.don{margin:0 20px calc(20px + env(safe-area-inset-bottom,0px));padding:16px;border-top:1px solid var(--line);text-align:center}
.don a{display:inline-flex;gap:6px;align-items:center;margin-top:10px;padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:600 14px sans-serif;text-decoration:none}
.don a svg{color:#f43f5e}
.mono{direction:ltr}
[dir=rtl] .tl{padding-left:0;padding-right:22px}
[dir=rtl] .tl:before{left:auto;right:6px}
[dir=rtl] .it:before{left:auto;right:-21px}
.trbar{display:flex;gap:6px;align-items:center;margin-top:10px;font-size:12px;color:var(--mut)}
.trbar button{margin-left:auto;background:none;border:0;color:var(--acc);font:600 12px sans-serif;cursor:pointer}
.credit{margin-top:14px;font-size:10px;letter-spacing:.4px;color:#5b6375}
.boot{padding:40px 24px;text-align:center;color:#8b93a5;font:14px sans-serif;line-height:1.5}
</style>
</head>

  const tr=(k,a)=>{let s=(T[lang][k]||T.en[k]||k);(a||[]).forEach((v,i)=>{s=s.replace("{"+i+"}",v)});return s};
  const fd=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString(LOC[lang],{day:"numeric",month:"numeric",year:"numeric"})};
  const fk=n=>Number(n).toLocaleString(LOC[lang])+" km";
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  const save=async(vin,rec)=>{
    if(LIVE){const r=await rpc("add_record",{p_vin:vin,p_km:rec.km,p_text:rec.text});return r.count}
    const n=(db[vin]||[]).length+1;setDb(d=>({...d,[vin]:[...(d[vin]||[]),rec]}));return n};
  const lookup=async(vin)=>{
    if(LIVE){const r=await rpc("get_history",{p_vin:vin});return r&&r.length?r.map(x=>({date:x.service_date,km:x.km,text:x.description})):null}
    return db[vin]?[...db[vin]].sort((a,b)=>a.date.localeCompare(b.date)||a.km-b.km):null};
  const chg=v=>{setLang(v);document.documentElement.lang=v;try{localStorage.setItem("av_lang",v)}catch(e){}};
  return h(Ctx.Provider,{value:{tr,fd,fk,lang}},h("div",{className:"app"},
    h("div",{className:"top"},h("div",{className:"logo"},h(Ic,{n:"car",s:22})),
      h("div",{className:"grow"},h("div",{className:"brand"},"Auto",h("span",null,"Verify")),h("div",{className:"sub"},tr("sub"))),
      h("div",{className:"lang"},h(Ic,{n:"globe",s:16}),h("select",{value:lang,"aria-label":"Language",onChange:e=>chg(e.target.value)},Object.keys(T).map(k=>h("option",{key:k,value:k},T[k].n))))),
    h("div",{className:"seg"},
      h("button",{className:mode==="mech"?"on":"",onClick:()=>setMode("mech")},h(Ic,{n:"wrench",s:17}),tr("mech")),
      h("button",{className:mode==="buy"?"on":"",onClick:()=>setMode("buy")},h(Ic,{n:"search",s:17}),tr("buy"))),
    h("main",null,mode==="mech"?h(Mechanic,{db,save}):h(Buyer,{db,lookup})),h(Donate)));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
}
