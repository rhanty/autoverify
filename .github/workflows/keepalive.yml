name: Keep Supabase alive
on:
  schedule:
    - cron: "0 6 */3 * *"   # každé 3 dni o 6:00 UTC
  workflow_dispatch: {}      # umožní spustiť ručne (tlačidlo Run workflow)
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          curl -fsS -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/get_history" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"p_vin":"00000000000000000"}'
